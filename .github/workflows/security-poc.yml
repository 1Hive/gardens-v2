name: Security PoC Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - pkg/contracts/src/**/*.sol
      - pkg/contracts/test/**/*.sol
      - pkg/contracts/scripts/check-security-poc-coverage.mjs
      - apps/web/app/api/passport-oracle/write-score/**
      - security/advisory-history.md
      - security/security-poc-coverage.md
      - .github/workflows/security-poc.yml
  pull_request:
    paths:
      - pkg/contracts/src/**/*.sol
      - pkg/contracts/test/**/*.sol
      - pkg/contracts/scripts/check-security-poc-coverage.mjs
      - apps/web/app/api/passport-oracle/write-score/**
      - security/advisory-history.md
      - security/security-poc-coverage.md
      - .github/workflows/security-poc.yml

permissions:
  contents: read

jobs:
  security-poc:
    name: Security PoC (no-regression)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        run: .github/scripts/init-contract-submodules.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check accepted advisory coverage
        run: node pkg/contracts/scripts/check-security-poc-coverage.mjs

      - name: Run SecurityPoC and contract regression tests
        run: forge test --no-match-path 'pkg/contracts/test/fork/*' --summary

  web-security-poc:
    name: Security PoC (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Passport relay regression tests
        run: pnpm --dir apps/web exec vitest run 'app/api/passport-oracle/write-score/[chain]/route.test.ts'
