name: Build, Lint and Test

permissions:
  contents: read

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    name: Build, Lint and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      SCORER_ID: ${{ secrets.SCORER_ID }}
      GITCOIN_PASSPORT_API_KEY: ${{ secrets.GITCOIN_PASSPORT_API_KEY }}
      LIST_MANAGER_PRIVATE_KEY: ${{ secrets.LIST_MANAGER_PRIVATE_KEY }}
      FOUNDRY_OUT: pkg/contracts/out

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        run: .github/scripts/init-contract-submodules.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "pnpm"

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache turbo build
        uses: actions/cache@v4
        with:
          path: ".turbo"
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # - name: Build and Test
      #   run: pnpm test

  contract-release:
    name: Contract release tooling and storage
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        run: .github/scripts/init-contract-submodules.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build contracts and deployment scripts
        run: forge build --quiet

      - name: Verify diamond and factory storage layouts
        working-directory: pkg/contracts
        run: bash scripts/verify-storage-layout.sh --skip-build

      - name: Check shared routing release scripts
        working-directory: pkg/contracts
        run: |
          node --check scripts/prepare-shared-routing.mjs
          node --check scripts/prepare-shared-release.mjs
          node --check scripts/verify-shared-routing.mjs
          bash -n scripts/verify-all-deployments.sh
