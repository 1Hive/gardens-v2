name: Contract Audit (Code Scanning)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - pkg/contracts/src/**/*.sol
      - pkg/contracts/scripts/check-slither-baseline.mjs
      - pkg/contracts/slither-baseline.json
      - .github/workflows/contract-audit.yml
  pull_request:
    paths:
      - pkg/contracts/src/**/*.sol
      - pkg/contracts/scripts/check-slither-baseline.mjs
      - pkg/contracts/slither-baseline.json
      - .github/workflows/contract-audit.yml

jobs:
  analyze:
    name: Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        run: .github/scripts/init-contract-submodules.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Slither
        run: python -m pip install --upgrade pip slither-analyzer==0.10.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Slither
        id: slither
        run: |
          slither . \
            --sarif results.sarif \
            --foundry-out-directory=pkg/contracts/out \
            --exclude-dependencies \
            --exclude-low \
            --exclude-informational \
            --exclude-optimization \
            --fail-none
          test -s results.sarif
          echo "sarif=results.sarif" >> "$GITHUB_OUTPUT"

      - name: Reject unreviewed Slither findings
        run: node pkg/contracts/scripts/check-slither-baseline.mjs results.sarif

      - name: Upload SARIF file
        if: always() && steps.slither.outputs.sarif != '' && github.repository == '1Hive/gardens-v2'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

      # The private remediation mirror cannot publish code-scanning results.
      - name: Preserve SARIF for private review
        if: always() && steps.slither.outputs.sarif != '' && github.repository != '1Hive/gardens-v2'
        uses: actions/upload-artifact@v4
        with:
          name: slither-sarif
          path: ${{ steps.slither.outputs.sarif }}
